<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="color-scheme" content="dark" />
<title>Your project: The Scaffold</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Spectral:ital,wght@0,400;0,500;1,400&family=Karla:wght@400;500;600;700&display=swap" />
<style>
/* Job.html: the client's private project page (/j/<token>). The link is the
   key; there is no login. Reads and acts through /api/job. Plain JS, no
   framework, so it opens fast on a phone. Every piece of text is set with
   textContent, so nothing from the job can inject markup.

   Look: the Scaffold's own. Lamplit dark wood, Cormorant headings, Spectral
   text, Karla labels in sentence case, hairline rules, square bone buttons.
   Layout: a header, a four-part progress line, then ONE screen for where the
   project is right now (waiting, proposal, directions, final, done). */
:root {
  --bg: #1a120b; --bg-soft: #221710; --bg-deep: #0f0a06; --card: #241810;
  --ink: #ecd9b2; --ink-soft: #c9b48a; --ink-mute: #9a8462;
  --amber: #d99a3d; --amber-lit: #f5cd6a; --brass: #c2a46a; --on-ink: #1a120b;
  --rule: rgba(236,217,178,.16); --rule-strong: rgba(236,217,178,.32);
  --ok: #8fb07c; --err: #e0a85a;
  --display: "Cormorant Garamond", Georgia, serif; --body: "Spectral", Georgia, serif; --ui: "Karla", "Spectral", system-ui, sans-serif;
  --gutter: clamp(16px, 5vw, 40px);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; font: 17px/1.65 var(--body);
  background: radial-gradient(120% 130% at 74% 30%, #2a1d10 0%, #1a120b 38%, #0d0905 78%) fixed; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5; z-index: 0;
  background-image: repeating-linear-gradient(to right, transparent 0, transparent calc(9% - 1px), rgba(0,0,0,.42) calc(9% - 1px), rgba(0,0,0,.42) 9%, rgba(236,217,178,.022) 9%, rgba(236,217,178,.022) calc(9% + 1px), transparent calc(9% + 1px), transparent 18%); }
a { color: var(--amber-lit); }
:focus-visible { outline: 2px solid var(--amber-lit); outline-offset: 3px; }

.frame { position: relative; z-index: 1; width: 100%; max-width: 780px; margin: 0 auto; padding: 0 var(--gutter) 64px; min-width: 0; }
.mast { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 22px 0 18px; border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { width: 34px; height: auto; display: block; flex: none; opacity: .92; }
.brand b { font: 500 22px/1.1 var(--display); display: block; }
.brand span { font: 400 14px var(--ui); color: var(--ink-mute); }
.kicker { font: 500 15px var(--ui); color: var(--ink-soft); overflow-wrap: anywhere; text-align: right; }

.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; list-style: none; padding: 0; margin: 26px 0 0; }
.steps li { font: 500 14px var(--ui); color: var(--ink-mute); padding-top: 9px; border-top: 3px solid var(--rule); min-width: 0; }
.steps li.done { color: var(--ink-soft); border-top-color: var(--amber); }
.steps li.now { color: var(--amber-lit); border-top-color: var(--amber-lit); }
.steps .n { margin-right: 6px; } .steps .bar { display: none; }

.body { padding: clamp(28px, 5vw, 48px) 0 0; display: flex; flex-direction: column; gap: 28px; }
.center { align-items: center; text-align: center; }
.badge { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--amber); background: rgba(217,154,61,.12); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 26px rgba(217,154,61,.22); }
.hl { font: 500 clamp(36px, 7vw, 56px)/1.04 var(--display); margin: 0; overflow-wrap: break-word; text-wrap: balance; letter-spacing: -.005em; }
.lede { font-size: 18px; line-height: 1.7; color: var(--ink-soft); max-width: 600px; margin: 0; }
.center .lede { margin-inline: auto; }
h2.sec { font: 500 26px/1.15 var(--display); margin: 0 0 12px; }

.panel { background: var(--bg-soft); border: 1px solid var(--rule); padding: clamp(18px, 3vw, 28px); }
table { width: 100%; border-collapse: collapse; }
td { padding: 11px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.amt { text-align: right; font: 500 16px var(--ui); white-space: nowrap; padding-left: 18px; font-variant-numeric: tabular-nums; }
tr.total td { border-bottom: 0; border-top: 1px solid var(--rule-strong); font: 600 18px var(--ui); color: var(--amber-lit); padding-top: 14px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px 28px; margin-top: 22px; }
.facts b { font: 500 14px var(--ui); color: var(--ink-mute); display: block; margin-bottom: 2px; }
.facts p { margin: 0; }

.btn { display: block; width: 100%; padding: 0 24px; min-height: 52px; border: 1px solid var(--ink); background: var(--ink); color: var(--on-ink); font: 500 16px/1 var(--ui); cursor: pointer; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: background-color .2s, border-color .2s, color .2s, transform .2s; }
.btn:hover { background: var(--amber-lit); border-color: var(--amber-lit); color: var(--on-ink); }
.btn:active { transform: translateY(1px); }
.btn.alt { background: transparent; color: var(--ink); border-color: var(--rule-strong); }
.btn.alt:hover { background: transparent; color: var(--amber-lit); border-color: var(--amber-lit); }
.btn:disabled { opacity: .5; cursor: default; }
.acts { display: grid; gap: 12px; max-width: 520px; width: 100%; }
.center .acts { margin-inline: auto; }
textarea { width: 100%; min-height: 96px; padding: 13px 14px; background: var(--bg-deep); color: var(--ink); border: 1px solid var(--rule-strong); font: 16px/1.5 var(--body); resize: vertical; border-radius: 0; }
textarea::placeholder { color: var(--ink-mute); opacity: 1; }
textarea:focus-visible { outline-offset: 0; border-color: var(--amber-lit); }
.err { color: var(--err); font: 500 15px var(--ui); margin: 0; min-height: 1.2em; }
.flash { background: var(--bg-soft); border-left: 3px solid var(--amber); padding: 14px 18px; font: 500 16px var(--ui); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 16px; }
.tile { border: 1px solid var(--rule); background: var(--bg-deep); display: flex; flex-direction: column; min-width: 0; }
.tile.picked { border-color: var(--amber-lit); box-shadow: 0 0 0 1px var(--amber-lit), 0 0 28px rgba(217,154,61,.18); }
.tile .prev { aspect-ratio: 4 / 3; background: var(--bg-soft) center / contain no-repeat; display: flex; align-items: center; justify-content: center; color: var(--ink-mute); font: 500 15px var(--ui); text-decoration: none; }
.tile .meta { padding: 14px; display: grid; gap: 12px; }
.tile .name { font: 500 16px var(--ui); overflow-wrap: anywhere; }
.tile .tag { font: 500 14px var(--ui); color: var(--amber-lit); }

.files { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.files a { display: flex; justify-content: space-between; gap: 14px; align-items: center; padding: 14px 16px; background: var(--bg-soft); border: 1px solid var(--rule); text-decoration: none; font: 500 16px var(--ui); color: var(--ink); overflow-wrap: anywhere; }
.files a::after { content: "Open"; color: var(--amber-lit); font-size: 15px; flex: none; }
.files a:hover { border-color: var(--amber-lit); }

.pay .row { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.pay .row:last-of-type { border-bottom: 0; }
.pay .what { font: 500 17px var(--ui); } .pay .sm { font: 400 14px var(--ui); color: var(--ink-mute); display: block; }
.pay .paid { font: 500 15px var(--ui); color: var(--ok); }
.pay .btn { width: auto; min-width: 180px; }

details.more { border-top: 1px solid var(--rule); padding-top: 18px; }
details.more summary { font: 500 16px var(--ui); color: var(--ink-soft); cursor: pointer; padding: 8px 0; }
details.more > div { padding-top: 14px; display: flex; flex-direction: column; gap: 22px; }

.foot { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--rule); color: var(--ink-mute); font: 400 15px var(--ui); }

@media (max-width: 560px) {
  .pay .btn { width: 100%; }
  .steps li { font-size: 13px; } .steps .n { display: none; }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
<link rel="stylesheet" href="motion.css" />
</head>
<body>
<div class="frame">
  <header class="mast">
    <div class="brand"><img src="/assets/antler.png" alt="" /><div><b>The Scaffold</b><span>by Carter Groff</span></div></div>
    <div class="kicker" id="kicker">Your project</div>
  </header>
  <ol class="steps" id="steps" aria-label="Progress" hidden></ol>
  <main class="body" id="app"><p class="lede">Loading your project…</p></main>
  <div class="foot">Questions about anything here? Reply to Carter’s email and it reaches him directly.</div>
</div>
<noscript><p style="position:fixed;left:16px;right:16px;bottom:16px;margin:0;padding:14px;background:#ecd9b2;color:#1a120b;font:16px system-ui">This page needs JavaScript. Reply to Carter’s email and he will help.</p></noscript>
<script>
(function () {
  var token = (location.pathname.match(/\/j\/([a-f0-9]{24,64})/) || [])[1] || new URLSearchParams(location.search).get('t');
  var app = document.getElementById('app');
  var stepsEl = document.getElementById('steps');
  // The four steps a client sees. A brand-new job is still "Proposal" (waiting for it).
  var STEPS = ['Proposal', 'Directions', 'Final', 'Paid'];
  var STEP_OF = { new: 0, proposed: 0, drafts: 1, final: 2, paid: 3 };
  var money = function (n) { return '$' + Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); };
  var safe = function (u) { return /^https?:\/\//i.test(u || '') ? u : null; };
  var SVG = 'http://www.w3.org/2000/svg';

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'class') e.className = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] != null && attrs[k] !== false) e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function act(body, btn, errEl) {
    body.t = token;
    if (btn) btn.disabled = true;
    if (errEl) errEl.textContent = '';
    return fetch('/api/job', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong.'); return j; }); })
      .catch(function (e) { if (errEl) errEl.textContent = e.message; if (btn) btn.disabled = false; throw e; });
  }
  function badge() {
    var s = document.createElementNS(SVG, 'svg'); s.setAttribute('width', '26'); s.setAttribute('height', '26'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS(SVG, 'path'); p.setAttribute('d', 'M5 13l4 4L19 7'); p.setAttribute('stroke', '#f5cd6a'); p.setAttribute('stroke-width', '3'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');
    s.appendChild(p);
    return el('div', { class: 'badge' }, [s]);
  }
  function ending(title, text, extra) {
    return el('section', { class: 'center', style: 'display:flex;flex-direction:column;align-items:center;gap:16px;padding:clamp(8px,3vw,32px) 0' }, [badge(), el('h1', { class: 'hl', text: title }), el('p', { class: 'lede', text: text })].concat(extra || []));
  }
  function head(title, text) { return el('section', { style: 'display:grid;gap:12px' }, [el('h1', { class: 'hl', text: title }), text ? el('p', { class: 'lede', text: text }) : null]); }

  // ── pieces ────────────────────────────────────────────────────────────
  function proposalBlock(d, withAccept) {
    var p = d.proposal;
    var rows = (p.items || []).map(function (i) { return el('tr', null, [el('td', { text: i.label }), el('td', { class: 'amt', text: money(i.amount) })]); });
    rows.push(el('tr', { class: 'total' }, [el('td', { text: 'Total' }), el('td', { class: 'amt', text: money(p.total) })]));
    var pay = p.billing === 'end' ? 'Paid in full when you approve the final.' : 'Half to start (' + money(p.total / 2) + '), half when you approve the final.';
    var panel = el('div', { class: 'panel' }, [
      p.summary ? el('p', { style: 'margin:0 0 14px', text: p.summary }) : null,
      el('table', null, [el('tbody', null, rows)]),
      el('div', { class: 'facts' }, [
        p.timeline ? el('div', null, [el('b', { text: 'Timeline' }), el('p', { text: p.timeline })]) : null,
        el('div', null, [el('b', { text: 'Payment' }), el('p', { text: pay + ' Card or bank, no fee.' })]),
        p.terms ? el('div', null, [el('b', { text: 'Terms' }), el('p', { text: p.terms })]) : null,
      ]),
    ]);
    var out = [panel];
    if (withAccept && p.status === 'sent') {
      var c = el('textarea', { placeholder: 'Anything to add? (optional)', 'aria-label': 'Comment' });
      var err = el('p', { class: 'err', role: 'alert' });
      var b = el('button', { class: 'btn', type: 'button', text: 'Accept the proposal', onclick: function () { act({ action: 'accept', comment: c.value }, b, err).then(function () { load('Thank you. Carter has your acceptance.'); }); } });
      out.push(c, el('div', { class: 'acts' }, [b]), err);
    }
    return out;
  }

  function preview(f) {
    var href = safe(f.href);
    var isImg = href && /^image\//.test(f.type) && !f.linked;
    var a = el('a', { class: 'prev', href: href, target: '_blank', rel: 'noopener', text: isImg ? '' : (f.linked ? 'Open the link' : 'Open the file') });
    if (isImg) a.style.backgroundImage = 'url("' + href.replace(/"/g, '%22') + '")';
    return a;
  }

  function directionsBlock(d, picking) {
    var c = picking ? el('textarea', { placeholder: 'What do you like? Anything to change? (optional)', 'aria-label': 'Comment' }) : null;
    var err = el('p', { class: 'err', role: 'alert' });
    var tiles = d.drafts.map(function (f) {
      var picked = d.job.picked_file_id === f.id;
      var kids = [el('span', { class: 'name', text: f.label })];
      if (picking) {
        var b = el('button', { class: picked ? 'btn alt' : 'btn', type: 'button', text: picked ? 'Your pick' : 'Pick this one', onclick: function () {
          act({ action: 'pick', file_id: f.id, comment: c.value }, b, err).then(function () { load('Thank you. Carter has your pick.'); });
        } });
        kids.push(b);
      } else if (picked) kids.push(el('span', { class: 'tag', text: 'Your pick' }));
      return el('div', { class: 'tile' + (picked ? ' picked' : '') }, [preview(f), el('div', { class: 'meta' }, kids)]);
    });
    var out = [el('div', { class: 'grid' }, tiles)];
    if (picking) out.push(c, err);
    return out;
  }

  function payBlock(d) {
    var err = el('p', { class: 'err', role: 'alert' });
    var rows = d.invoices.map(function (i) {
      var right;
      if (i.status === 'paid') right = el('span', { class: 'paid', text: 'Paid' });
      else {
        right = el('button', { class: 'btn', type: 'button', text: 'Pay ' + money(i.amount), onclick: function () {
          right.textContent = 'Opening payment…';
          act({ action: 'pay', invoice_id: i.id }, right, err).then(function (j) { if (safe(j.url)) location.href = j.url; }).catch(function () { right.textContent = 'Pay ' + money(i.amount); });
        } });
      }
      return el('div', { class: 'row' }, [el('div', null, [el('span', { class: 'what', text: i.label || 'Invoice' }), el('span', { class: 'sm', text: money(i.amount) })]), right]);
    });
    return el('section', { class: 'panel pay' }, [el('h2', { class: 'sec', text: 'Payment' }), el('p', { class: 'lede', style: 'font-size:16px;margin-bottom:6px', text: 'Card or bank transfer through Stripe. No fee.' })].concat(rows).concat([err]));
  }

  function filesBlock(list) {
    return el('ul', { class: 'files' }, list.map(function (f) { return el('li', null, [el('a', { href: safe(f.href), target: '_blank', rel: 'noopener', text: f.label })]); }));
  }

  function moreBlock(d, which) {
    var parts = [];
    if (which.indexOf('proposal') >= 0 && d.proposal) parts.push(el('div', null, [el('h2', { class: 'sec', text: 'Your proposal' })].concat(proposalBlock(d, false))));
    if (which.indexOf('directions') >= 0 && d.drafts.length) parts.push(el('div', null, [el('h2', { class: 'sec', text: 'The directions' })].concat(directionsBlock(d, false))));
    if (!parts.length) return null;
    return el('details', { class: 'more' }, [el('summary', { text: 'Look back at your project' }), el('div', null, parts)]);
  }

  // ── the one screen for where the project is now ───────────────────────
  function screen(d) {
    var j = d.job, out = [];
    var unpaid = d.invoices.filter(function (i) { return i.status !== 'paid'; });
    var left = Math.max(0, j.revisions_included - j.revisions_used);

    if (j.stage === 'paid') {
      out.push(ending('All done, thank you', 'Your files are below, and your payments are in.'));
      if (d.finals.length) out.push(el('section', null, [el('h2', { class: 'sec', text: 'Your files' }), filesBlock(d.finals)]));
      if (d.invoices.length) out.push(payBlock(d));
      out.push(moreBlock(d, ['proposal', 'directions']));
      return out;
    }

    if (j.stage === 'final') {
      var waitingPay = unpaid.length && j.approved;
      if (j.approved) {
        out.push(ending('Approved, thank you', unpaid.length ? 'One step left: the payment below.' : 'Carter will send your files shortly.'));
      } else {
        out.push(head('Your final', left ? 'Happy with it? Approve it. Want changes? Say what, and Carter will revise (' + left + ' round' + (left === 1 ? '' : 's') + ' of changes left).' : 'Happy with it? Approve it. Further changes can be quoted separately.'));
        if (d.finals.length) out.push(filesBlock(d.finals));
        var c = el('textarea', { placeholder: 'What would you like changed? (needed for changes, optional for approval)', 'aria-label': 'Comment' });
        var err = el('p', { class: 'err', role: 'alert' });
        var ok = el('button', { class: 'btn', type: 'button', text: 'Approve the final', onclick: function () { act({ action: 'approve', comment: c.value }, ok, err).then(function () { load('Thank you. You approved the final.'); }); } });
        var ch = el('button', { class: 'btn alt', type: 'button', text: 'Ask for changes', onclick: function () {
          if (!c.value.trim()) { err.textContent = 'Say what you would like changed.'; c.focus(); return; }
          act({ action: 'changes', comment: c.value }, ch, err).then(function () { load('Thank you. Carter has your changes.'); });
        } });
        out.push(c, el('div', { class: 'acts' }, [ok, ch]), err);
      }
      if (unpaid.length) out.splice(waitingPay ? 1 : 0, 0, payBlock(d));
      out.push(moreBlock(d, ['proposal', 'directions']));
      return out;
    }

    if (j.stage === 'drafts') {
      if (unpaid.length) out.push(payBlock(d));
      if (!d.drafts.length) {
        out.push(ending('Thank you, you are in', 'Carter is working on your directions. You will get an email when they are ready.'));
      } else {
        out.push(head('Your directions', j.picked_file_id ? 'Thanks for your pick. Carter is making the final; you can still change your mind.' : 'Pick the direction you like best. Add a note if you want anything changed.'));
        directionsBlock(d, true).forEach(function (n) { out.push(n); });
      }
      out.push(moreBlock(d, ['proposal']));
      return out;
    }

    if (j.stage === 'proposed' && d.proposal) {
      out.push(head('Your proposal', 'Read it through. If it looks right, accept it and Carter gets started.'));
      proposalBlock(d, true).forEach(function (n) { out.push(n); });
      return out;
    }

    // new, or proposed without a visible proposal
    out.push(ending('Brief received', 'Carter will send a proposal here soon, usually within a business day.'));
    return out;
  }

  function render(d, flash) {
    var j = d.job;
    document.title = j.title + ': The Scaffold';
    document.getElementById('kicker').textContent = j.title;
    var idx = STEP_OF[j.stage] != null ? STEP_OF[j.stage] : 0;
    stepsEl.hidden = false; stepsEl.textContent = '';
    STEPS.forEach(function (label, i) {
      stepsEl.appendChild(el('li', { class: i < idx ? 'done' : i === idx ? 'now' : '', 'aria-current': i === idx ? 'step' : null }, [el('span', { class: 'n', text: i < idx ? '✓' : String(i + 1) }), el('span', { class: 't', text: label })]));
      if (i < STEPS.length - 1) stepsEl.appendChild(el('span', { class: 'bar' }));
    });
    app.textContent = '';
    app.classList.remove('center', 'enter'); void app.offsetWidth; app.classList.add('enter');
    if (new URLSearchParams(location.search).get('paid') === '1') app.appendChild(el('div', { class: 'flash', role: 'status', text: 'Thank you, your payment went through. It can take a minute to show here.' }));
    if (flash) app.appendChild(el('div', { class: 'flash', role: 'status', text: flash }));
    screen(d).forEach(function (n) { if (n) app.appendChild(n); });
  }

  function fail(msg) {
    stepsEl.hidden = true;
    app.textContent = '';
    app.appendChild(ending('This link does not work', msg));
    // a failed link has no tick: swap the badge for nothing
    var b = app.querySelector('.badge'); if (b) b.remove();
  }

  function load(flash) {
    if (!token) { fail('This link is not complete. Use the button in Carter’s email.'); return; }
    fetch('/api/job?t=' + encodeURIComponent(token), { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'This link is not valid.'); return j; }); })
