<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Carter Groff — Admin Login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Karla:wght@400;500;600&display=swap" />
<style>
  :root {
    --bg: #1a120b; --bg-deep: #0f0a06; --card: #241810; --card-edge: rgba(236,217,178,0.12);
    --ink: #ecd9b2; --ink-mute: #8a7758;
    --amber: #d99a3d; --terracotta: #b8643f;
    --display-font: "Cormorant Garamond", Georgia, serif; --ui-font: "Karla", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0905; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: var(--ui-font); color: var(--ink);
    background: radial-gradient(ellipse at 60% 28%, rgba(217,154,61,0.14), transparent 55%), var(--bg);
  }
  .card {
    width: min(90vw, 380px); background: var(--card); border: 1px solid var(--card-edge);
    border-radius: 6px; padding: 44px 36px; box-shadow: 0 30px 60px -30px rgba(0,0,0,0.85), 0 2px 6px rgba(0,0,0,0.6);
    text-align: center;
  }
  .mark { width: 46px; height: 46px; margin: 0 auto 22px; border: 1px solid var(--ink-mute);
    display: flex; align-items: center; justify-content: center; font-family: var(--display-font);
    font-size: 19px; color: var(--ink); }
  .mark span { color: var(--amber); }
  h1 { font-family: var(--display-font); font-weight: 500; font-size: 28px; margin: 0 0 8px; }
  p.sub { font-family: var(--display-font); font-style: italic; font-size: 14px; color: var(--ink-mute); margin: 0 0 32px; }
  input {
    width: 100%; background: var(--bg-deep); color: var(--ink); border: 1px solid var(--card-edge);
    border-radius: 3px; padding: 13px 14px; font-family: var(--ui-font); font-size: 15px;
    outline: none; margin-bottom: 6px; transition: border-color .2s ease, box-shadow .2s ease;
  }
  input:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(217,154,61,0.14); }
  button {
    width: 100%; padding: 13px; border-radius: 3px; cursor: pointer; border: 1px solid var(--amber);
    background: var(--amber); color: #1a120b; font-family: var(--ui-font); font-size: 13px;
    font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; transition: background .15s ease;
    margin-top: 18px;
  }
  button:hover { background: #e7b357; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .err { color: var(--terracotta); font-family: var(--ui-font); font-size: 12.5px; text-align: left; min-height: 16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">C<span>·</span>G</div>
    <h1>Admin</h1>
    <p class="sub">Enter the password to continue.</p>
    <form id="f">
      <input id="pw" type="password" placeholder="Password" autofocus autocomplete="current-password" />
      <div class="err" id="err"></div>
      <button id="btn" type="submit">Sign in</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('f');
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');
    const next = new URLSearchParams(location.search).get('next') || '/admin';
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true; btn.textContent = 'Checking…'; err.textContent = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('pw').value }),
        });
        if (res.ok) { location.href = next; return; }
        err.textContent = 'Wrong password.';
      } catch (e2) {
        err.textContent = 'Something went wrong — try again.';
      }
      btn.disabled = false; btn.textContent = 'Sign in';
    });
  </script>
</body>
</html>
