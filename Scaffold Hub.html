<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>The Scaffold · Carter Groff</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="stylesheet" href="parlor.css" />
<style>
html { overflow-x: hidden; }
body { min-height: 100vh; background: #100b06; }
.stage { position: relative; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 76px 40vw 76px clamp(26px,7vw,110px); background: radial-gradient(120% 130% at 74% 50%, #2a1d10 0%, #1a120b 38%, #0d0905 78%); overflow: hidden; transition: filter .3s ease; }
.stage::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .5; background-image: repeating-linear-gradient(to right, transparent 0, transparent calc(9% - 1px), rgba(0,0,0,.42) calc(9% - 1px), rgba(0,0,0,.42) 9%, rgba(236,217,178,.022) 9%, rgba(236,217,178,.022) calc(9% + 1px), transparent calc(9% + 1px), transparent 18%); }
.fog { position: absolute; left: -30%; right: -30%; bottom: -120px; height: 420px; pointer-events: none; filter: blur(48px); mix-blend-mode: screen; background: radial-gradient(ellipse 50% 100% at 50% 50%, rgba(230,222,205,.14) 0%, rgba(205,196,176,.07) 42%, transparent 72%); animation: drift 26s ease-in-out infinite alternate; }
@keyframes drift { 0% { transform: translateX(-11%); } 100% { transform: translateX(9%); } }
.antler { position: relative; width: clamp(88px,7vw,116px); opacity: .9; animation: fade 1.2s ease-out .1s both; }
.antler img { width: 100%; height: auto; display: block; }
.plaque { position: relative; margin-top: 34px; font-family: var(--ui); font-size: 10px; letter-spacing: .4em; text-transform: uppercase; color: var(--ink-dim); animation: fade 1.2s ease-out 1.5s both; }
.greet { position: relative; margin-top: 14px; font-family: var(--display); font-weight: 500; font-size: clamp(44px,7.4vw,88px); line-height: .92; letter-spacing: -.035em; animation: rise 1.5s cubic-bezier(.2,.7,.3,1) 1.1s both; }
.greet em { font-style: italic; color: var(--amber); text-shadow: 0 0 46px rgba(217,154,61,.45); }
.pair { position: relative; display: flex; gap: clamp(30px,5vw,72px); margin-top: clamp(42px,6vh,72px); flex-wrap: wrap; animation: rise 1.4s cubic-bezier(.2,.7,.3,1) 2.15s both; }
.door { position: relative; max-width: 290px; display: block; }
.door .no { font-family: var(--ui); font-size: 9.5px; letter-spacing: .3em; color: var(--ink-dim); transition: color .35s; }
.door h2 { font-family: var(--display); font-weight: 500; font-size: clamp(27px,3vw,36px); line-height: 1.06; letter-spacing: -.02em; margin: 14px 0 0; transition: color .35s; }
.door p { font-family: var(--body); font-size: 14px; line-height: 1.6; color: var(--ink-mute); margin: 11px 0 0; transition: color .35s; }
.door .arrow { display: inline-block; margin-top: 16px; font-family: var(--ui); font-size: 17px; color: var(--ink-dim); transition: color .35s, transform .45s cubic-bezier(.2,.7,.3,1); }
.door:hover h2, .door:focus-visible h2 { color: var(--amber-lit); }
.door:hover .no, .door:hover .arrow { color: var(--amber); }
.door:hover .arrow { transform: translateX(7px); }
.door:hover p { color: var(--ink-soft); }
.door:focus-visible { outline: none; }
.aside { position: relative; display: flex; align-items: center; gap: 12px; margin-top: clamp(28px,4vh,40px); animation: rise 1.4s cubic-bezier(.2,.7,.3,1) 2.45s both; }
.aside a { display: flex; align-items: baseline; gap: 11px; padding: 9px 0; border-bottom: 1px solid transparent; transition: border-color .35s; text-decoration: none; }
.aside a:hover { border-bottom-color: rgba(217,154,61,.5); }
.aside .k { font-family: var(--ui); font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: var(--ink-mute); transition: color .3s; }
.aside a:hover .k { color: var(--amber-lit); }
.aside .n { font-family: var(--body); font-size: 12.5px; color: var(--ink-dim); }
.foot { position: relative; display: flex; align-items: center; gap: 20px; margin-top: clamp(26px,4vh,44px); animation: fade 1.2s ease-out 2.8s both; }
.foot a, .foot button { font-family: var(--ui); font-size: 9px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-dim); background: none; border: none; cursor: pointer; padding: 8px 0; text-decoration: none; }
.foot a:hover, .foot button:hover { color: var(--ink-mute); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
.sconce { position: fixed; right: 16vw; top: 50%; transform: translateY(-50%); z-index: 60; display: flex; align-items: center; gap: 20px; background: none; border: none; cursor: pointer; padding: 16px; animation: wickfade 1.3s ease-out .15s both; text-decoration: none; }
@keyframes wickfade { from { opacity: 0; } to { opacity: 1; } }
.sconce .tube { position: relative; width: 34px; height: min(72vh,620px); border-radius: 20px; padding: 9px 0; display: flex; justify-content: center; background: linear-gradient(90deg,#0e0904,#221809 34%,#33260f 58%,#140d06); border: 1px solid rgba(217,154,61,.42); box-shadow: inset 0 0 22px rgba(0,0,0,.92), 0 6px 26px rgba(0,0,0,.7); transition: border-color .45s ease, box-shadow .45s ease; }
.sconce .core { width: 11px; border-radius: 8px; background: linear-gradient(to bottom, rgba(245,205,106,.45), rgba(245,205,106,.92) 9%, #fff3d2 50%, rgba(245,205,106,.92) 91%, rgba(245,205,106,.45)); box-shadow: 0 0 16px #f5cd6a, 0 0 54px rgba(245,205,106,.8), 0 0 130px rgba(217,154,61,.55); animation: flick 6.5s ease-in-out infinite; transition: width .45s cubic-bezier(.2,.7,.3,1), box-shadow .45s ease; }
.sconce .wall { position: absolute; left: 50%; top: 50%; width: min(70vw,760px); height: 118%; transform: translate(-50%,-50%); pointer-events: none; border-radius: 50%; background: radial-gradient(closest-side, rgba(245,205,106,.26), rgba(217,154,61,.09) 44%, transparent 76%); mix-blend-mode: screen; animation: breathe 5.6s ease-in-out infinite; transition: opacity .45s ease; }
.sconce .tag { font-family: var(--ui); font-size: 10px; letter-spacing: .36em; text-transform: uppercase; color: var(--ink-mute); writing-mode: vertical-rl; transform: rotate(180deg); transition: color .35s ease, letter-spacing .5s ease; }
.sconce:hover .tag, .sconce:focus-visible .tag { color: var(--amber-lit); letter-spacing: .46em; }
.sconce:hover .tube, .sconce:focus-visible .tube { border-color: rgba(245,205,106,.95); box-shadow: inset 0 0 26px rgba(0,0,0,.85), 0 0 44px -8px rgba(217,154,61,.5), 0 6px 26px rgba(0,0,0,.7); }
.sconce:hover .core, .sconce:focus-visible .core { width: 15px; animation: surge 2.6s ease-in-out infinite; box-shadow: 0 0 26px #fff8e2, 0 0 90px rgba(245,205,106,1), 0 0 220px rgba(217,154,61,.85); }
.sconce:hover .wall, .sconce:focus-visible .wall { animation: flare 2.6s ease-in-out infinite; }
.sconce:focus-visible { outline: none; }
.embers { position: absolute; left: 50%; bottom: 8%; width: 120px; height: 76%; margin-left: -60px; pointer-events: none; opacity: 0; transition: opacity .5s ease; }
.sconce:hover .embers, .sconce:focus-visible .embers { opacity: 1; }
.embers i { position: absolute; bottom: 0; width: 3px; height: 3px; border-radius: 50%; background: #f5cd6a; box-shadow: 0 0 8px rgba(245,205,106,.9); opacity: 0; animation: ember 4.2s ease-out infinite; }
@keyframes ember { 0% { transform: translate3d(0,0,0) scale(.7); opacity: 0; } 12% { opacity: .9; } 70% { opacity: .5; } 100% { transform: translate3d(var(--dx,10px),-260px,0) scale(.35); opacity: 0; } }
@keyframes surge { 0%,100% { filter: brightness(1.08); } 28% { filter: brightness(1.3); } 44% { filter: brightness(1.02); } 62% { filter: brightness(1.34); } 80% { filter: brightness(1.12); } }
@keyframes flare { 0%,100% { opacity: 1; transform: translate(-50%,-50%) scale(1.02); } 40% { opacity: 1; transform: translate(-50%,-50%) scale(1.16); } 70% { opacity: .92; transform: translate(-50%,-50%) scale(1.08); } }
@keyframes flick { 0%,100% { filter: brightness(1); } 44% { filter: brightness(.9); } 52% { filter: brightness(1.1); } 72% { filter: brightness(.95); } }
@keyframes breathe { 0%,100% { opacity: .7; transform: translate(-50%,-50%) scale(.96); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.06); } }
body.wick-near .stage, .stage.wick-near { filter: brightness(1.07) saturate(1.04); }
.lock { position: fixed; inset: 0; z-index: 800; display: grid; place-items: center; padding: 28px; background: radial-gradient(90% 90% at 50% 40%, #1e1509, #0b0704); }
.lockbox { position: relative; width: min(340px,100%); text-align: center; }
.lockbox img { width: 84px; margin: 0 auto 24px; display: block; opacity: .9; }
.lockbox h2 { font-family: var(--display); font-weight: 500; font-size: 31px; letter-spacing: .01em; margin: 0; }
.lockbox .sub { margin-top: 11px; font-family: var(--ui); font-size: 9.5px; letter-spacing: .34em; text-transform: uppercase; color: var(--ink-mute); }
.lockrow { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; }
@media (max-width: 1200px) { .stage { padding-right: 34vw; } .sconce { right: 11vw; } .pair { gap: 30px; } .door { max-width: 228px; } .door h2 { font-size: 26px; } }
@media (max-width: 900px) { .stage { padding-right: 30vw; } .sconce { right: 6vw; gap: 14px; } .sconce .tube { width: 28px; } .sconce .core { width: 9px; } }
@media (max-width: 760px) {
  .stage { padding: 54px 24px 110px; justify-content: flex-start; }
  .antler { width: 84px; }
  .greet { font-size: clamp(40px,12vw,60px); margin-top: 12px; }
  .plaque { margin-top: 26px; }
  .sconce { position: relative; right: auto; top: auto; transform: none; flex-direction: column; gap: 12px; margin: 34px 0 0; padding: 6px 0; align-items: flex-start; width: 100%; }
  .sconce .tube { width: 100%; max-width: 340px; height: 26px; padding: 0 9px; flex-direction: column; justify-content: center; background: linear-gradient(180deg,#0e0904,#221809 34%,#33260f 58%,#140d06); }
  .sconce .core { width: 100%; height: 10px; background: linear-gradient(to right, rgba(245,205,106,.45), rgba(245,205,106,.92) 9%, #fff3d2 50%, rgba(245,205,106,.92) 91%, rgba(245,205,106,.45)); }
  .sconce .wall { width: 150%; height: 320px; }
  .sconce .tag { writing-mode: horizontal-tb; transform: none; }
  .pair { gap: 34px; margin-top: 44px; }
  .door { max-width: none; }
}
</style>
</head>
<body class="p-grain">
  <div id="root"></div>
  <script>
    // Same-origin link clicks (Docket/Wick/Command Center/Hub all share this
    // login) shouldn't count as "leaving" -- only a real tab-close or
    // refresh should log out, so those clicks are marked and pagehide skips
    // the beacon for them.
    window.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]');
      if (a && a.origin === location.origin) window.__skipLogout = true;
    }, true);
    window.addEventListener('pagehide', function () {
      if (!window.__skipLogout && navigator.sendBeacon) navigator.sendBeacon('/api/logout');
    });
  </script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="command-center-data.jsx"></script>
  <script type="text/babel" src="scaffold-hub.jsx"></script>
