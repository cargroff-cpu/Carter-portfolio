<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Marketing Command Center · The Scaffold</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="stylesheet" href="parlor.css" />
<link rel="stylesheet" href="mcc.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@0,400;0,600;0,700;1,600;1,700&family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=Archivo:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" />
<style>
  /* Shell layout — matches design-reference/Marketing Command Center.html */
  body { min-height: 100vh; background: linear-gradient(180deg, #1e1509, var(--bg) 320px); }
  .top { position: sticky; top: 0; z-index: 40; background: rgba(26,18,11,.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .topin { display: flex; align-items: center; gap: 12px; padding: 14px 20px; flex-wrap: wrap; }
  @media (max-width: 759px) { .seg button { padding: 9px 11px; letter-spacing: .14em; font-size: 9.5px; } }
  .mark { display: flex; align-items: center; gap: 11px; flex: none; min-width: 0; }
  .mark img { width: 30px; height: auto; opacity: .92; flex: none; }
  .mark b { font-family: var(--display); font-size: 19px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
  .mark span { display: none; font-family: var(--ui); font-size: 9px; letter-spacing: .28em; text-transform: uppercase; color: var(--text-4); margin-top: 2px; }
  .spacer { flex: 1; }
  .nav { display: flex; gap: 0; overflow-x: auto; padding: 0 20px; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { background: none; border: none; border-bottom: 1px solid transparent; color: var(--text-3); font-family: var(--ui); font-size: 10px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; padding: 14px 16px; min-height: 44px; white-space: nowrap; display: flex; align-items: center; gap: 8px; margin-bottom: -1px; transition: color .2s, border-color .2s; }
  .nav button:first-child { padding-left: 0; }
  .nav button:hover { color: var(--text-2); }
  .nav button[aria-current="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .nav .later { color: var(--text-4); }
  .nav .later:hover { color: var(--text-3); }
  .nav .lock { width: 10px; height: 10px; opacity: .7; }
  .navdiv { width: 1px; background: var(--line); margin: 14px 14px; flex: none; }
  main { padding: 8px 20px 120px; max-width: 1180px; margin: 0 auto; }
  .stack { display: flex; flex-direction: column; gap: 0; }
  .stack > * + * { margin-top: 4px; }
  .qa { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: flex; align-items: center; gap: 10px; background: var(--text); color: #1a120b; border: 1px solid var(--text); font-family: var(--ui); font-size: 10px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; padding: 16px 22px; min-height: 52px; box-shadow: 0 20px 40px -18px rgba(0,0,0,.9); transition: background .25s, border-color .25s; cursor: pointer; }
  .qa:hover { background: var(--accent-lit); border-color: var(--accent-lit); }
  .goals { display: grid; gap: 0; }
  .goal { padding: 30px 0; }
  .goal .bignum { font-family: var(--display); font-size: clamp(64px,17vw,86px); font-weight: 500; line-height: .9; letter-spacing: -.035em; margin: 20px 0 12px; }
  .goal .bignum span { font-size: .36em; color: var(--text-4); margin-left: 10px; letter-spacing: 0; }
  .goals.two { grid-template-columns: 1fr; }
  .flagbox { padding: 22px 0; border-top: 1px solid var(--line); color: var(--danger); }
  .flagbox .h2 { color: var(--text); }
  .flagbox.slim { font-size: 13.5px; line-height: 1.6; color: var(--warn); }
  .reclistwrap { display: flex; flex-direction: column; }
  .reclist { display: block; width: 100%; text-align: left; background: none; border: none; border-top: 1px solid var(--line); padding: 17px 0; transition: padding-left .35s cubic-bezier(.2,.7,.3,1); cursor: pointer; }
  .reclistwrap .reclist:first-child { border-top: none; }
  .reclist:hover { padding-left: 10px; }
  .nogoal { font-size: 13.5px; line-height: 1.6; color: var(--text-2); padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .spendgrid { display: grid; gap: 26px; }
  .spendcol { display: flex; flex-direction: column; gap: 0; }
  .spendrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .spendnum { font-family: var(--display); font-size: 26px; letter-spacing: -.02em; color: var(--text); }
  .spendnote { font-size: 12.5px; line-height: 1.55; color: var(--warn); margin-top: 11px; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 18px 0; }
  .filters .select { max-width: 190px; min-height: 40px; flex: 1 1 150px; }
  .desktop-only { display: none; }
  .cols { display: grid; gap: 0; }
  .fldgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 20px; }
  .fld { min-width: 0; }
  .mailblock { border-top: 1px solid var(--line); }
  .chk { display: flex; align-items: center; gap: 12px; padding: 14px 0; font-size: 14px; color: var(--text-2); border-bottom: 1px solid var(--line); }
  .chk:last-child { border-bottom: none; }
  .chk .box { width: 15px; height: 15px; flex: none; border: 1px solid var(--line-2); display: grid; place-items: center; }
  .chk.on .box { border-color: var(--accent); color: var(--accent); }
  .chk.on { color: var(--text); }
  .attr { font-size: 14.5px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .attr.missing { color: var(--danger); font-size: 13.5px; line-height: 1.55; }
  .urlbox { font-family: var(--ui); font-size: 11.5px; line-height: 1.7; word-break: break-all; padding: 14px 0; color: var(--text-3); border-bottom: 1px solid var(--line); }
  .urlcell { display: block; max-width: 300px; font-family: var(--ui); font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { text-align: center; padding: 56px 0; }
  .scrim { position: fixed; inset: 0; z-index: 60; background: rgba(8,5,2,.72); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 640px; max-height: 92vh; display: flex; flex-direction: column; background: #20160e; border: 1px solid var(--line-2); }
  .sheethead { padding: 22px; border-bottom: 1px solid var(--line); }
  .sheetbody { flex: 1; min-height: 0; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 26px; }
  .req, .opt { border: none; padding: 0; }
  .req { padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  .qgrid { display: grid; gap: 16px; }
  .sheetfoot { display: flex; gap: 10px; padding: 18px 22px 22px; border-top: 1px solid var(--line); }
  .sheetfoot .btn { flex: 1; }
  @media (min-width: 760px) {
    .topin { padding: 16px 30px; }
    .mark span { display: block; }
    .nav { padding: 0 30px; }
    main { padding: 12px 30px 90px; }
    .stack > * + * { margin-top: 10px; }
    .goals.two { grid-template-columns: 1fr 1fr; gap: 44px; }
    .desktop-only { display: block; }
    .mobile-only { display: none; }
    .cols { grid-template-columns: 1.6fr 1fr; gap: 52px; align-items: start; }
    .cols.links { grid-template-columns: 1fr 1.3fr; }
    .qgrid { grid-template-columns: 1fr 1fr; }
    .scrim { align-items: center; }
    .qa { right: 30px; bottom: 30px; }
    .detailhead { align-items: flex-start; padding-bottom: 6px; }
  }
  @media (min-width: 1100px) { main { padding: 16px 40px 90px; } .fldgrid { grid-template-columns: 1fr 1fr 1fr; } }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="command-center-data.jsx"></script>
  <script type="text/babel" src="command-center.jsx"></script>
</body>
</html>
