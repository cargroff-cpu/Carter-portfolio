<style>
  /* Shell layout — matches design-reference/Marketing Command Center.html */
  body { min-height: 100vh; background: linear-gradient(180deg, #1e1509, var(--bg) 320px); }
  .top { position: sticky; top: 0; z-index: 40; background: rgba(26,18,11,.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .topin { display: flex; align-items: center; gap: 12px; padding: 14px 20px; flex-wrap: wrap; }
  @media (max-width: 759px) { .seg button { padding: 9px 11px; letter-spacing: .14em; font-size: 9.5px; } }
  .mark { display: flex; align-items: center; gap: 11px; flex: none; min-width: 0; }
  .mark img { width: 30px; height: auto; opacity: .92; flex: none; }
  .mark b { font-family: var(--display); font-size: 19px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
  .mark span { display: none; font-family: var(--ui); font-size: 9px; letter-spacing: .28em; text-transform: uppercase; color: var(--text-4); margin-top: 2px; }
  .spacer { flex: 1; }
  .nav { display: flex; gap: 0; overflow-x: auto; padding: 0 20px; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { background: none; border: none; border-bottom: 1px solid transparent; color: var(--text-3); font-family: var(--ui); font-size: 10px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; padding: 14px 16px; min-height: 44px; white-space: nowrap; display: flex; align-items: center; gap: 8px; margin-bottom: -1px; transition: color .2s, border-color .2s; }
  .nav button:first-child { padding-left: 0; }
  .nav button:hover { color: var(--text-2); }
  .nav button[aria-current="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .nav .later { color: var(--text-4); }
  .nav .later:hover { color: var(--text-3); }
  .nav .lock { width: 10px; height: 10px; opacity: .7; }
  .navdiv { width: 1px; background: var(--line); margin: 14px 14px; flex: none; }
  main { padding: 8px 20px 120px; max-width: 1180px; margin: 0 auto; }
  @keyframes screenfade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .screenfade { animation: screenfade .28s cubic-bezier(.2,.7,.3,1); }
  .stack { display: flex; flex-direction: column; gap: 0; }
  .stack > * + * { margin-top: 4px; }
  .qa { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: flex; align-items: center; gap: 10px; background: var(--text); color: #1a120b; border: 1px solid var(--text); font-family: var(--ui); font-size: 10px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; padding: 16px 22px; min-height: 52px; box-shadow: 0 20px 40px -18px rgba(0,0,0,.9); transition: background .25s, border-color .25s; cursor: pointer; }
  .qa:hover { background: var(--accent-lit); border-color: var(--accent-lit); }
  .goals { display: grid; gap: 0; }
  .goal { padding: 30px 0; }
  .goal .bignum { font-family: var(--display); font-size: clamp(64px,17vw,86px); font-weight: 500; line-height: .9; letter-spacing: -.035em; margin: 20px 0 12px; }
  .goal .bignum span { font-size: .36em; color: var(--text-4); margin-left: 10px; letter-spacing: 0; }
  .goals.two { grid-template-columns: 1fr; }
  .flagbox { padding: 22px 0; border-top: 1px solid var(--line); color: var(--danger); }
  .flagbox .h2 { color: var(--text); }
  .flagbox.slim { font-size: 13.5px; line-height: 1.6; color: var(--warn); }
  .reclistwrap { display: flex; flex-direction: column; }

  .reclistwrap .reclist:first-child { border-top: none; }
  .reclist:hover { padding-left: 10px; }
  .nogoal { font-size: 13.5px; line-height: 1.6; color: var(--text-2); padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .spendgrid { display: grid; gap: 26px; }
  .spendcol { display: flex; flex-direction: column; gap: 0; }

  .spendnum { font-family: var(--display); font-size: 26px; letter-spacing: -.02em; color: var(--text); }
  .spendnote { font-size: 12.5px; line-height: 1.55; color: var(--warn); margin-top: 11px; }
  /* ── builder ── */

  .kitrow { display: flex; align-items: baseline; gap: 12px; justify-content: space-between; padding: 8px 0; }

  .swatches { display: flex; gap: 6px; }
  .sw { width: 16px; height: 16px; border: 1px solid var(--line-2); }

  .l-p { font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.68; color: #3a3634; margin: 0 0 13px; }
  .l-ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }

  .s-top { background: #0e3c56; padding: 15px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  .s-eyebrow { font-family: 'Archivo', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .16em; font-size: 10.5px; color: #176b8d; }
  .s-p { font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 14px; line-height: 1.55; color: #43687c; margin: 12px 0 0; }
  .s-bar { display: inline-block; margin-top: 18px; background: #9bcf36; color: #0e3c56; font-family: 'Archivo', sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -.01em; font-size: 17px; padding: 11px 18px; }

  .urlbox { font-family: var(--ui); font-size: 11.5px; line-height: 1.7; word-break: break-all; padding: 14px 0; color: var(--text-3); border-bottom: 1px solid var(--line); }
  .urlcell { display: block; max-width: 300px; font-family: var(--ui); font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

<!-- Lamplight — a visual-only overlay pass (backgrounds/panels/glow), loaded
     last so it wins the cascade over mcc.css and the shell styles above.
     No structural/behavior change; safe to remove this one line to revert. -->
<link rel="stylesheet" href="lamplight.css" />

<body>
  <div id="root"></div>
  <script>
    // Same-origin link clicks (Docket/Wick/Command Center/Hub all share this
    // login) shouldn't count as "leaving" -- only a real tab-close or
    // refresh should log out, so those clicks are marked and pagehide skips
    // the beacon for them.
    window.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]');
      if (a && a.origin === location.origin) window.__skipLogout = true;
    }, true);
    window.addEventListener('pagehide', function () {
      if (!window.__skipLogout && navigator.sendBeacon) navigator.sendBeacon('/api/logout');
    });
  </script>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
