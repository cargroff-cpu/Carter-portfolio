<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>Carter Groff — Portfolio Directions</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #0d0905; font-family: "Spectral", Georgia, serif; }
  #root:empty::before {
    content: ''; display: block; height: 100%;
  }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (pinned, required) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <!-- TopoJSON decoder (for the high-detail travel world map) -->
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

  <!-- Theme tokens + global CSS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }
  </script>
  <script src="cg-store.js"></script>
  <script type="text/babel" src="themes.jsx"></script>
  <!-- Data -->
  <script type="text/babel" src="data.jsx"></script>
  <!-- Motifs + placeholder components -->
  <script type="text/babel" src="motifs.jsx"></script>
  <!-- Portfolio component (sections + composition) -->
  <script type="text/babel" src="portfolio.jsx"></script>
  <!-- App: render Portfolio full-bleed -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
