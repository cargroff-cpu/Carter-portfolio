<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<link rel="manifest" href="/backroom.webmanifest" />
<meta name="theme-color" content="#100b06" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Backroom" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="apple-touch-icon" href="/assets/scaffold-icon-180.png" />
<title>Business Hub · The Backroom</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="stylesheet" href="parlor.css" />
<link rel="stylesheet" href="mcc.css" />
<link rel="stylesheet" href="motion.css" />
<style>
html { overflow-x: hidden; }
body { min-height: 100vh; background: linear-gradient(180deg, #1e1509, var(--bg) 320px); }
.top { position: sticky; top: 0; z-index: 40; background: rgba(26,18,11,.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topin { display: flex; align-items: center; gap: 12px; padding: 14px 20px; flex-wrap: wrap; }
.mark { display: flex; align-items: center; gap: 11px; flex: none; min-width: 0; }
.mark img { width: 30px; height: auto; opacity: .92; flex: none; }
.mark b { font-family: var(--display); font-size: 19px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
.mark span { display: none; font-family: var(--ui); font-size: 9px; letter-spacing: .28em; text-transform: uppercase; color: var(--text-4); margin-top: 2px; }
.topnav { display: flex; gap: 0; margin-left: auto; flex-wrap: wrap; }
.topnav a { font-family: var(--ui); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--text-3); padding: 12px 14px; min-height: 44px; display: flex; align-items: center; white-space: nowrap; }
.topnav a:hover { color: var(--text); }
.shell main { padding: 22px 20px 120px; }
@media (min-width: 760px) { .topin { padding: 16px 30px; } .mark span { display: block; } .shell main { padding: 26px 30px 90px; } }
/* Jobs board: one column per stage (business-hub.jsx) */
.jboard { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: start; }
.jcards { display: grid; gap: 2px; padding: 6px; }
.jcards .reclist { text-align: left; }
@media (max-width: 1100px) { .jboard { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 700px) { .jboard { grid-template-columns: minmax(0, 1fr); } }
/* Mail: template boxes, the dialog, the email preview (the real email is paper-coloured) */
.tplgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tplcard { text-align: left; display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-top: 2px solid var(--accent); padding: 16px 18px; min-width: 0; }
.tplcard:hover { border-color: var(--line-2); border-top-color: var(--accent-lit); transform: translateY(-2px); }
.tplcard:focus-visible { outline: 2px solid var(--accent-lit); outline-offset: 2px; }
.tpl-name { font-family: var(--display); font-size: 21px; color: var(--text); }
.tpl-subj { font-family: var(--ui); font-size: 13px; color: var(--accent-lit); overflow-wrap: anywhere; }
.tpl-snip { font-size: 14px; line-height: 1.5; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tpl-when { font-family: var(--ui); font-size: 12.5px; color: var(--text-3); margin-top: auto; padding-top: 6px; border-top: 1px solid var(--line); }
.tpl-raw { margin-top: 14px; color: var(--text-2); font-size: 14px; }
.tpl-raw summary { color: var(--text-3); font-family: var(--ui); font-size: 13px; }
.tpl-raw pre { white-space: pre-wrap; font: 13px/1.55 var(--ui); background: var(--field); border: 1px solid var(--line); padding: 12px; margin: 8px 0 0; }
.modal-back { position: fixed; inset: 0; z-index: 1000; background: rgba(8,5,2,.78); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { width: min(620px, 100%); max-height: min(90vh, 880px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line-2); border-top: 2px solid var(--accent); box-shadow: 0 30px 80px -20px rgba(0,0,0,.9); }
.modal.wide { width: min(1040px, 100%); }
.modal-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 20px 24px 14px; border-bottom: 1px solid var(--line); }
.modal-h .sub { margin-top: 4px; max-width: 70ch; }
.modal-b { padding: 20px 24px; overflow-y: auto; min-height: 0; flex: 1; }
.modal-f { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; padding: 14px 24px; border-top: 1px solid var(--line); background: rgba(0,0,0,.14); }
.cmp-res { margin-right: auto; font-family: var(--ui); font-size: 13px; color: var(--text-3); min-width: 0; }
.cmp-res.bad { color: var(--warn); }
.cmp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.cmp-tabs { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { background: none; border: 1px solid var(--line-2); color: var(--text-3); font-family: var(--ui); font-size: 13px; padding: 7px 12px; min-height: 36px; }
.chip:hover { color: var(--text); border-color: var(--text-3); }
.chip.on { color: #1a120b; background: var(--text); border-color: var(--text); }
.cmp-btnrow { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; font-family: var(--ui); font-size: 14px; color: var(--text-2); }
.cmp-btnrow .input { grid-column: 1 / -1; }
.mail-prev { background: #0f0a06; border: 1px solid var(--line); padding: 14px; }
.mp-subj { font-family: var(--ui); font-size: 13px; color: var(--text-2); margin-bottom: 10px; overflow-wrap: anywhere; }
.mp-subj span { color: var(--text-4); margin-right: 8px; }
.mp-card { background: #1d140c; border: 1px solid #4a3722; border-radius: 6px; color: #ecd9b2; overflow: hidden; }
.mp-card::before { content: ''; display: block; height: 5px; background: linear-gradient(90deg, #d99a3d, #f5cd6a, #d99a3d); }
.mp-top { display: flex; align-items: center; gap: 14px; padding: 20px 26px; background: #26190f; border-bottom: 1px solid #4a3722; }
.mp-top img { width: 44px; height: 44px; border-radius: 8px; border: 1px solid #4a3722; flex: none; }
.mp-top b { display: block; font: 500 21px/1.1 Georgia, serif; color: #f5cd6a; }
.mp-top span { display: block; margin-top: 4px; font: 14px Arial, sans-serif; color: #b9a47c; }
.mp-body { padding: 28px 26px 8px; }
.mp-body h3 { margin: 0 0 6px; font: 500 28px/1.2 Georgia, serif; color: #f8ecd0; }
.mp-body h3::after { content: ''; display: block; width: 56px; height: 3px; margin: 8px 0 20px; background: #d99a3d; }
.mp-body p { margin: 0 0 16px; font: 16.5px/1.65 Georgia, serif; color: #ecd9b2; overflow-wrap: anywhere; }
.mp-btn { display: inline-block; margin: 6px 0 22px; padding: 14px 26px; background: linear-gradient(180deg, #f8d77f, #d99a3d); border: 1px solid #f5cd6a; color: #1a120b; border-radius: 3px; font: 700 15px Arial, sans-serif; }
.mp-foot { padding: 16px 26px 22px; background: #150e08; border-top: 1px solid #4a3722; font: 14px/1.55 Arial, sans-serif; color: #b9a47c; }
.mp-foot i { display: block; margin-top: 8px; font: italic 15px Georgia, serif; color: #d99a3d; }
@media (max-width: 900px) {
  .tplgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cmp { grid-template-columns: minmax(0, 1fr); }
  .cmp-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .cmp-tabs button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-3); font-family: var(--ui); font-size: 15px; padding: 10px 16px; min-height: 44px; }
  .cmp-tabs button.on { color: var(--text); border-bottom-color: var(--accent-lit); }
  .cmp-form, .cmp-prev { display: none; }
  .cmp-form.show, .cmp-prev.show { display: block; }
}
@media (max-width: 560px) {
  .tplgrid { grid-template-columns: minmax(0, 1fr); }
  .modal-back { padding: 0; align-items: flex-end; }
  .modal, .modal.wide { width: 100%; max-height: 94vh; border-left: 0; border-right: 0; }
  .modal-h, .modal-b, .modal-f { padding-left: 16px; padding-right: 16px; }
  .modal-f { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .modal-f .btn { flex: 1; }
  .cmp-res { flex: 1 1 100%; }
}
/* Clients: summary cards, a table, a profile with tabs */
.dkpis.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.dkpi.static { cursor: default; }
.dkpi.static:hover { transform: none; box-shadow: none; border-color: var(--line); border-top-color: var(--accent); }
.ctable td .sub, .ctable th { font-size: 13px; }
.ctable tbody tr:focus-visible { outline: 2px solid var(--accent-lit); outline-offset: -2px; }
.ctabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.ctabs button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-3); font-family: var(--ui); font-size: 14px; padding: 12px 14px; min-height: 44px; white-space: nowrap; }
.ctabs button:hover { color: var(--text); }
.ctabs button.on { color: var(--text); border-bottom-color: var(--accent-lit); }
.ctabs button:focus-visible { outline: 2px solid var(--accent-lit); outline-offset: -2px; }
@media (max-width: 1000px) { .dkpis.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .dkpis.four .dkpi:last-child { grid-column: auto; } }
/* Today: the dashboard */
.dash-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.dash-h .sub { margin-top: 4px; }
.dkpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.dkpi { text-align: left; background: var(--surface); border: 1px solid var(--line); border-top: 2px solid var(--accent); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; cursor: pointer; transition: border-color .2s, transform .2s; }
.dkpi:hover { border-color: var(--line-2); border-top-color: var(--accent-lit); transform: translateY(-2px); }
.dkpi:focus-visible, .pipe-r:focus-visible { outline: 2px solid var(--accent-lit); outline-offset: 2px; }
.dkpi-l { font-family: var(--ui); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dkpi-v { font-family: var(--display); font-size: 34px; line-height: 1.1; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
.dkpi-n { font-family: var(--ui); font-size: 13px; color: var(--text-3); }
.dkpi-n.hot { color: var(--accent-lit); }
.dash-g { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.widget { background: var(--surface); border: 1px solid var(--line); padding: 16px 18px 10px; min-width: 0; }
.widget-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.widget-b { font-family: var(--ui); font-size: 12px; color: var(--text-3); letter-spacing: .06em; }
.pipe { display: flex; flex-direction: column; padding: 4px 0 8px; }
.pipe-r { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 0; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; width: 100%; }
.pipe-r:first-child { border-top: 0; }
.pipe-r.static { cursor: default; }
.pipe-n { font-family: var(--ui); font-size: 14px; color: var(--text-2); }
.pipe-bar { height: 8px; background: rgba(236,217,178,.08); display: block; }
.pipe-bar i { display: block; height: 100%; background: var(--accent); min-width: 0; }
.pipe-c { font-size: 14px; color: var(--text); white-space: nowrap; }
@media (max-width: 1100px) { .dkpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) { .dash-g { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .dkpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .dkpis .dkpi:last-child { grid-column: 1 / -1; } .dkpi { padding: 14px; } .dkpi-v { font-size: 28px; } .dash-h .btn { width: 100%; } .pipe-r { grid-template-columns: 78px minmax(0, 1fr) auto; } }
@media (max-width: 760px) {
  .top .topin { padding: 10px 16px; gap: 2px 8px; flex-wrap: nowrap; }
  .top .topnav { margin-left: auto; flex-wrap: nowrap; }
  .top .topnav a { font-size: 13px; letter-spacing: .03em; text-transform: none; padding: 12px 8px; }
  .mark b { font-size: 18px; }
  .jcol .pad { padding: 12px 0; }
  .jcards { padding: 0 0 12px; gap: 8px; }
  .jcards .reclist { border: 1px solid var(--line-2); padding: 14px; background: rgba(236,217,178,.03); }
  .jcards > .sub { padding: 0 0 4px !important; }
}
/* ── 2026-11-06: the Scaffold's type (layout option 1) ──────────────────
   Scoped to this page; the Docket shares mcc.css and is untouched.
   Sentence case everywhere, bigger and brighter small text, hairline rules
   instead of boxes. Computer/tablet: the tools stay a sidebar. Phone and
   the home-screen app: the same tools are a bar at the bottom (mcc.css). */
:root { --text-3: #ad9a74; --text-4: #8b7a5b; }
.lbl, .field-lbl { font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--text-2); }
.tag, .pill { font-size: 12.5px; letter-spacing: 0; text-transform: none; font-weight: 500; }
th { font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--text-3); }
.btn { font-size: 15px; letter-spacing: 0; text-transform: none; }
.btn.sm { font-size: 13.5px; }
.btn.quiet { letter-spacing: 0; }
.sub { font-size: 14.5px; }
.h1 { font-size: 40px; font-weight: 400; line-height: 1.05; }
.h2 { font-size: 24px; font-weight: 400; }
.mark span { font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--text-3); }
.topnav a { font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--text-2); }
.backlink { font-size: 14px; letter-spacing: 0; text-transform: none; }
/* Today: no boxes. The numbers are one ruled row; the panels sit on hairlines. */
.dkpis { gap: 0; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line); }
.dkpi { background: none; border: 0; border-left: 1px solid var(--line); padding: 16px 18px; transition: background .2s; }
.dkpi:first-child { border-left: 0; padding-left: 0; }
.dkpi:hover { background: rgba(236,217,178,.03); transform: none; border-color: var(--line); }
.dkpi-l { font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--text-2); }
.dkpi-v { font-size: 40px; font-weight: 400; }
.dkpi-n { font-size: 13.5px; }
.dkpi.static:hover { border-color: var(--line); }
.dash-g { gap: 36px 48px; margin-top: 18px; }
.widget svg[role="img"] { height: 190px !important; }
.widget { background: none; border: 0; padding: 0; }
.widget-h { padding-bottom: 12px; margin-bottom: 2px; }
.widget-b { font-size: 13.5px; letter-spacing: 0; }
.mtxt { font-size: 15px; }
.mval { font-size: 14px; }
.minirow { padding: 12px 0; }
.pipe-n, .pipe-c { font-size: 15px; }
.pipe-bar { height: 6px; }
.tplcard { background: none; border-top-width: 1px; border-top-color: var(--line-2); }
.ctabs button { font-size: 15px; }
@media (max-width: 1100px) { .dkpi:nth-child(4) { border-left: 0; padding-left: 0; } }
@media (max-width: 560px) {
  .dkpis { gap: 0; }
  .dkpi { padding: 14px 12px; }
  .dkpi:nth-child(odd) { border-left: 0; padding-left: 0; }
  .dkpi:nth-child(4) { border-left: 1px solid var(--line); padding-left: 12px; }
  .dkpis .dkpi:last-child { border-top: 1px solid var(--line); }
  .dkpi-v { font-size: 30px; }
  .h1 { font-size: 32px; }
}
/* the sidebar (computer and tablet): sticks just under the header */
@media (min-width: 761px) {
  .tools { top: var(--toph, 77px); height: calc(100dvh - var(--toph, 77px)); padding-top: 26px; }
  .tools button { padding: 10px 12px; }
  .tools .tname { font-size: 15px; letter-spacing: 0; text-transform: none; font-weight: 500; }
  .tools .tmeta { font-family: var(--ui); font-size: 13px; color: var(--text-3); margin-top: 2px; }
  .tools button[aria-current="true"] .tmeta { color: var(--text-2); }
}
/* the bottom bar (phone and the home-screen app): same names, sentence case */
@media (max-width: 760px) {
  .tools.on .tname { font-size: 12px; }
  .tools.on button[aria-current="true"] { background: none; }
  .tools.on button[aria-current="true"] .tname { color: var(--accent-lit); }
}
/* ── Leads (business-hub.jsx): the title with one focal number, a tab row, the stage cards ── */
.lhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 32px; flex-wrap: wrap; }
.lhead .sub { margin-top: 4px; }
.lfocus { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; }
.lfocus-l { font-family: var(--ui); font-size: 14px; color: var(--text-2); }
.lfocus-v { font-family: var(--display); font-size: 48px; line-height: 1; font-weight: 400; color: var(--accent-lit); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.lfocus-n { font-family: var(--ui); font-size: 13.5px; color: var(--text-3); }
.ltabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.ltabs::-webkit-scrollbar { display: none; }
.ltabs button { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: 0; color: var(--text-3); font-family: var(--ui); font-size: 15px; font-weight: 500; padding: 0 0 2px; min-height: 44px; white-space: nowrap; cursor: pointer; }
.ltabs button:hover { color: var(--text); }
.ltabs button.on { color: var(--accent-lit); border-bottom-color: var(--accent); }
.ltabs button:focus-visible { outline: 2px solid var(--accent-lit); outline-offset: 2px; }
.lbody { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.lstages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.lstage { text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 14px 14px 12px; min-width: 0; min-height: 44px; background: rgba(236,217,178,.025); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; color: var(--text); }
.lstage:hover { border-color: rgba(217,154,61,.55); background: rgba(217,154,61,.07); }
.lstage:focus-visible { outline: 2px solid var(--accent-lit); outline-offset: 2px; }
.lstage.hot { border-color: rgba(217,154,61,.4); }
.lstage-n { font-family: var(--ui); font-size: 14px; color: var(--text-2); }
.lstage-c { font-family: var(--display); font-size: 36px; line-height: 1.05; font-weight: 400; font-variant-numeric: tabular-nums; }
.lstage-m { font-family: var(--ui); font-size: 13.5px; color: var(--text-3); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lstage-bar { display: block; height: 3px; margin-top: 10px; border-radius: 2px; background: rgba(236,217,178,.1); overflow: hidden; }
.lstage-bar i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; transform: scaleX(var(--w, 0)); }
.lbrief .mval.hot { color: var(--accent-lit); }
@media (prefers-reduced-motion: no-preference) {
  .lbody { animation: m-up .45s var(--ease-out) both; }
  .lstage { animation: m-up .5s var(--ease-out) calc(.05s + var(--i, 0) * .06s) backwards; }
  .lstage-bar i { animation: l-grow .9s var(--ease-out) calc(.25s + var(--i, 0) * .06s) backwards; }
  @keyframes l-grow { from { transform: scaleX(0); } }
}
@media (max-width: 1100px) { .lstages { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) {
  .lstages { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .lstages .lstage:last-child { grid-column: 1 / -1; }
  .lstage { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; padding: 12px 12px 10px; }
  .lstage-c { font-size: 30px; grid-column: 2; grid-row: 1; }
  .lstage-n { grid-column: 1; grid-row: 1; }
  .lstage-m, .lstage-bar { grid-column: 1 / -1; }
  .lstage-bar { margin-top: 8px; }
  .lhead { align-items: flex-start; }
  .lfocus { align-items: flex-start; text-align: left; }
  .lfocus-v { font-size: 40px; }
  .ltabs { gap: 16px; margin: 0 -16px; padding: 0 16px; }
  .ltabs button { font-size: 14px; }
}
/* ── Polish pass (interface-design): touch targets, focus, numbers, wrapping. No behaviour changes. ── */
.mark, .backlink { min-height: 44px; display: inline-flex; align-items: center; }
.mono, .mval, .pipe-c, .dkpi-v, td { font-variant-numeric: tabular-nums; }
.h1, .h2 { text-wrap: balance; }
.sub { text-wrap: pretty; }
.minirow:focus-visible, .reclist:focus-visible, .lstage:focus-visible, .tools button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent-lit); outline-offset: 2px; }
.jcol .reclist:hover { background: rgba(217,154,61,.07); }
.minirow { min-height: 44px; }
@media (hover: none) { .minirow, .reclist { min-height: 48px; } }
/* ── CRM tools: tasks, search, duplicates, export ── */
.taskadd { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 4px 0 10px; }
.taskadd .input { flex: 1 1 160px; min-width: 0; min-height: 44px; }
.taskadd input[type=date] { flex: 0 1 160px; }
.taskadd .btn { min-height: 44px; }
.trow { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 4px; border-top: 1px solid var(--line); min-height: 52px; }
.trow.done .mtxt b { color: var(--text-3); text-decoration: line-through; }
.tcheck { width: 44px; height: 44px; background: none; border: 0; display: grid; place-items: center; cursor: pointer; padding: 0; }
.tcheck i { width: 20px; height: 20px; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-style: normal; font-size: 13px; line-height: 1; color: var(--bg); transition: background-color .15s, border-color .15s; }
.tcheck[aria-checked=true] i { background: var(--accent); border-color: var(--accent); }
.tcheck:hover i { border-color: var(--accent-lit); }
.tcheck:focus-visible { outline: 2px solid var(--accent-lit); outline-offset: -4px; }
.late { color: var(--warn); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-lit); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.exportbar { display: flex; justify-content: flex-end; }
.dupe { padding: 8px 0 4px; border-top: 1px solid var(--line); }
.hsearch { flex: none; margin-left: auto; }
.hsearch + .topnav { margin-left: 0; }
.hs-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; background: none; border: 1px solid transparent; border-radius: 22px; color: var(--text-3); cursor: pointer; transition: color .2s ease, border-color .2s ease, background .2s ease; }
.hs-btn:hover, .hsearch.open .hs-btn { color: #f5cd6a; border-color: rgba(245,205,106,.35); background: rgba(245,205,106,.06); }
.hs-btn .ticon { width: 20px; height: 20px; }
/* the panel hangs from the header, so nothing on the page moves when it opens */
.hs-panel { position: absolute; top: calc(100% + 6px); right: 14px; width: min(400px, calc(100vw - 28px)); z-index: 60; padding: 10px; background: var(--surface); border: 1px solid var(--line-2); border-top: 2px solid var(--accent); box-shadow: 0 24px 60px -18px rgba(0,0,0,.9); }
@media (min-width: 760px) { .hs-panel { right: 30px; } }
.hs-panel .input { width: 100%; min-height: 44px; }
.hs-panel input[type=search]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.hs-pop { margin-top: 8px; max-height: 60vh; overflow-y: auto; }
.hs-pop button { display: flex; gap: 10px; align-items: baseline; width: 100%; min-height: 44px; padding: 10px 14px; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); color: var(--text); font-family: var(--ui); font-size: 14px; cursor: pointer; }
.hs-pop button:first-child { border-top: 0; }
.hs-pop button:hover, .hs-pop button.on { background: rgba(236,217,178,.07); }
.hs-k { flex: none; width: 48px; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-3); }
.hs-t { min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 560px) {
  .trow { grid-template-columns: 44px minmax(0, 1fr); }
  .trow > .btn { grid-column: 2; justify-self: start; }
}
@media (prefers-reduced-motion: reduce) { .tcheck i { transition: none; } }
/* touch screens: every control reaches 44px */
@media (pointer: coarse), (max-width: 760px) {
  .btn.sm, .btn.quiet, .btn.ghost { min-height: 44px; }
  .dkpi, .pipe-r { min-height: 44px; }
  .linkbtn { min-height: 44px; display: inline-flex; align-items: center; }
}
/* phones: the header is one slim row; search is an icon that opens a panel under it */
@media (max-width: 760px) {
  .top .topin { padding: 6px 14px; }
}
/* small phones: the back link is just its arrow, so the whole header stays on one row */
@media (max-width: 420px) {
  .top .topin { padding: 6px 12px; gap: 2px 6px; }
  .backlink .bl-t { display: none; }
  .backlink { margin-right: 0; padding-right: 10px; }
  .mark { gap: 8px; }
  .mark img { width: 24px; }
  .top .mark b { font-size: 16px; }
  .top .topnav a { padding: 12px 6px; font-size: 12.5px; }
}
/* ── the opening (Intro in business-hub.jsx): once per visit ── */
.intro { position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
  background: radial-gradient(60% 50% at 50% 46%, #2a1c11, #120c07 70%); cursor: pointer; transition: opacity .5s ease .1s; }
.intro.out { opacity: 0; pointer-events: none; }
.intro-glow { position: absolute; left: 50%; top: 46%; width: min(70vmin, 560px); aspect-ratio: 1; transform: translate(-50%, -50%) scale(.4); border-radius: 50%;
  background: radial-gradient(closest-side, rgba(56,104,76,.55), rgba(36,72,52,.22) 50%, transparent 75%); opacity: 0; animation: in-glow 1.4s ease-out .05s forwards; }
.intro-dial { position: absolute; left: 50%; top: 46%; width: min(64vmin, 440px); height: auto; transform: translate(-50%, -50%); overflow: visible; }
.intro-ring { fill: none; stroke: rgba(245,205,106,.55); stroke-width: .8; stroke-dasharray: 100; stroke-dashoffset: 100; transform: rotate(-90deg); animation: in-draw 1.1s cubic-bezier(.6,.1,.2,1) .1s forwards; }
.intro-ring2 { fill: none; stroke: rgba(245,205,106,.18); stroke-width: .6; stroke-dasharray: 1.5 3; opacity: 0; animation: in-fade .8s ease .5s forwards; }
.intro-hours line { stroke: #f5cd6a; stroke-width: 1.6; stroke-linecap: round; opacity: 0; animation: in-fade .35s ease forwards; }
.intro-rays { animation: in-spin 14s linear infinite; }
.intro-rays line { stroke: rgba(245,205,106,.28); stroke-width: .5; opacity: 0; animation: in-fade 1s ease .55s forwards; }
.intro-crest { position: absolute; left: 50%; top: 46%; width: min(26vmin, 170px); height: auto; margin-left: calc(min(26vmin, 170px) / -2); margin-top: calc(min(26vmin, 170px) * -.40); opacity: 0; transform: scale(.82);
  filter: drop-shadow(0 0 0 rgba(245,205,106,0)); animation: in-crest .9s cubic-bezier(.2,.8,.2,1) .3s forwards; }
.intro.out .intro-crest { opacity: 1; filter: drop-shadow(0 0 0 rgba(245,205,106,0)); animation: none; }
.intro-word { position: absolute; left: 0; right: 0; top: calc(46% + min(32vmin, 220px) + 14px); text-align: center; opacity: 0; transform: translateY(10px); animation: in-rise .7s cubic-bezier(.2,.8,.2,1) .75s forwards; }
.intro-word b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(32px, 6vmin, 46px); color: var(--text); letter-spacing: -.01em; }
.intro-word span { display: block; margin-top: 4px; font-family: var(--ui); font-size: 14px; color: var(--text-3); }
.intro.out .intro-dial, .intro.out .intro-word, .intro.out .intro-glow { opacity: 0 !important; transition: opacity .3s ease; animation-play-state: paused; }
@keyframes in-glow { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes in-draw { to { stroke-dashoffset: 0; } }
@keyframes in-fade { to { opacity: 1; } }
@keyframes in-spin { to { transform: rotate(360deg); } }
@keyframes in-crest { 0% { opacity: 0; transform: scale(.82); } 60% { opacity: 1; filter: drop-shadow(0 0 26px rgba(245,205,106,.7)); } 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 12px rgba(245,205,106,.35)); } }
@keyframes in-rise { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .intro { display: none; } }
</style>
</head>
