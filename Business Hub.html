<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<link rel="manifest" href="/backroom.webmanifest" />
<meta name="theme-color" content="#100b06" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Backroom" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="apple-touch-icon" href="/assets/scaffold-icon-180.png" />
<title>Business Hub · The Backroom</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="stylesheet" href="parlor.css" />
<link rel="stylesheet" href="mcc.css" />
<link rel="stylesheet" href="motion.css" />
<style>
html { overflow-x: hidden; }
body { min-height: 100vh; background: linear-gradient(180deg, #1e1509, var(--bg) 320px); }
.top { position: sticky; top: 0; z-index: 40; background: rgba(26,18,11,.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topin { display: flex; align-items: center; gap: 12px; padding: 14px 20px; flex-wrap: wrap; }
.mark { display: flex; align-items: center; gap: 11px; flex: none; min-width: 0; }
.mark img { width: 30px; height: auto; opacity: .92; flex: none; }
.mark b { font-family: var(--display); font-size: 19px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
.mark span { display: none; font-family: var(--ui); font-size: 9px; letter-spacing: .28em; text-transform: uppercase; color: var(--text-4); margin-top: 2px; }
.topnav { display: flex; gap: 0; margin-left: auto; flex-wrap: wrap; }
.topnav a { font-family: var(--ui); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--text-3); padding: 12px 14px; min-height: 44px; display: flex; align-items: center; white-space: nowrap; }
.topnav a:hover { color: var(--text); }
.shell main { padding: 22px 20px 120px; }
@media (min-width: 760px) { .topin { padding: 16px 30px; } .mark span { display: block; } .shell main { padding: 26px 30px 90px; } }
/* Jobs board: one column per stage (business-hub.jsx) */
.jboard { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: start; }
.jcards { display: grid; gap: 2px; padding: 6px; }
.jcards .reclist { text-align: left; }
@media (max-width: 1100px) { .jboard { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 700px) { .jboard { grid-template-columns: minmax(0, 1fr); } }
/* Clients: summary cards, a table, a profile with tabs */
.dkpis.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.dkpi.static { cursor: default; }
.dkpi.static:hover { transform: none; box-shadow: none; border-color: var(--line); border-top-color: var(--accent); }
.ctable td .sub, .ctable th { font-size: 13px; }
.ctable tbody tr:focus-visible { outline: 2px solid var(--accent-lit); outline-offset: -2px; }
.ctabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.ctabs button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-3); font-family: var(--ui); font-size: 14px; padding: 12px 14px; min-height: 44px; white-space: nowrap; }
.ctabs button:hover { color: var(--text); }
.ctabs button.on { color: var(--text); border-bottom-color: var(--accent-lit); }
.ctabs button:focus-visible { outline: 2px solid var(--accent-lit); outline-offset: -2px; }
@media (max-width: 1000px) { .dkpis.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .dkpis.four .dkpi:last-child { grid-column: auto; } }
/* Today: the dashboard */
.dash-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.dash-h .sub { margin-top: 4px; }
.dkpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.dkpi { text-align: left; background: var(--surface); border: 1px solid var(--line); border-top: 2px solid var(--accent); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; cursor: pointer; transition: border-color .2s, transform .2s; }
.dkpi:hover { border-color: var(--line-2); border-top-color: var(--accent-lit); transform: translateY(-2px); }
.dkpi:focus-visible, .pipe-r:focus-visible { outline: 2px solid var(--accent-lit); outline-offset: 2px; }
.dkpi-l { font-family: var(--ui); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dkpi-v { font-family: var(--display); font-size: 34px; line-height: 1.1; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
.dkpi-n { font-family: var(--ui); font-size: 13px; color: var(--text-3); }
.dkpi-n.hot { color: var(--accent-lit); }
.dash-g { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.widget { background: var(--surface); border: 1px solid var(--line); padding: 16px 18px 10px; min-width: 0; }
.widget-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.widget-b { font-family: var(--ui); font-size: 12px; color: var(--text-3); letter-spacing: .06em; }
.pipe { display: flex; flex-direction: column; padding: 4px 0 8px; }
.pipe-r { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 0; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; width: 100%; }
.pipe-r:first-child { border-top: 0; }
.pipe-r.static { cursor: default; }
.pipe-n { font-family: var(--ui); font-size: 14px; color: var(--text-2); }
.pipe-bar { height: 8px; background: rgba(236,217,178,.08); display: block; }
.pipe-bar i { display: block; height: 100%; background: var(--accent); min-width: 0; }
.pipe-c { font-size: 14px; color: var(--text); white-space: nowrap; }
@media (max-width: 1100px) { .dkpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) { .dash-g { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .dkpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .dkpis .dkpi:last-child { grid-column: 1 / -1; } .dkpi { padding: 14px; } .dkpi-v { font-size: 28px; } .dash-h .btn { width: 100%; } .pipe-r { grid-template-columns: 78px minmax(0, 1fr) auto; } }
@media (max-width: 760px) {
  .top .topin { padding: 10px 16px; gap: 2px 8px; flex-wrap: nowrap; }
  .top .topnav { margin-left: auto; flex-wrap: nowrap; }
  .top .topnav a { font-size: 13px; letter-spacing: .03em; text-transform: none; padding: 12px 8px; }
  .mark b { font-size: 18px; }
  .jcol .pad { padding: 12px 0; }
  .jcards { padding: 0 0 12px; gap: 8px; }
  .jcards .reclist { border: 1px solid var(--line-2); padding: 14px; background: rgba(236,217,178,.03); }
  .jcards > .sub { padding: 0 0 4px !important; }
}
</style>
</head>
<body>
  <div id="root"></div>
  <!-- The Backroom no longer logs you out whenever a page is left (Back,
       refresh, a tab switch on a phone); that made the sign-in pop up on
       random screens. The session cookie now ends when the browser closes, or
       after 8 hours, or when you use Sign out. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="motifs.jsx"></script>
  <script type="text/babel" src="command-center-data.jsx"></script>
  <script type="text/babel" src="business-hub.jsx"></script>
</body>
</html>
